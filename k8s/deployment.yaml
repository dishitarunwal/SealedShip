# Sample app deployment. IMAGE is replaced with a digest-pinned reference at apply time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: trustdeploy
spec:
  replicas: 1
  selector:
    matchLabels: {app: sample-app}
  template:
    metadata:
      labels: {app: sample-app}
    spec:
      containers:
        - name: app
          image: IMAGE
          ports: [{containerPort: 8080}]
